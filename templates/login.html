<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>

        body{
            background:#020617;
            font-family:Arial;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .box{
            width:350px;
            background:#0f172a;
            padding:30px;
            border-radius:15px;
        }

        h1{
            color:white;
            text-align:center;
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:14px;
            margin-bottom:15px;
            border:none;
            border-radius:10px;
            background:#1e293b;
            color:white;
        }

        button{
            width:100%;
            padding:14px;
            border:none;
            border-radius:10px;
            background:#2563eb;
            color:white;
            cursor:pointer;
        }

        p{
            color:white;
            text-align:center;
            margin-top:15px;
        }

        a{
            color:#60a5fa;
        }

    </style>

</head>

<body>

    <div class="box">

        <h1>Login</h1>

        <form action="/login" method="POST">

            <input type="text" name="username" placeholder="Username" required>

            <input type="password" name="password" placeholder="Password" required>

            <button type="submit">Login</button>

        </form>

        <p>
            Don't have account?
            <a href="/signup">Signup</a>
        </p>

    </div>

</body>

</html>
