<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login</title>

    <link
        rel="stylesheet"
        href="/static/auth.css"
    >

</head>

<body>

<div class="auth-container">

    <div class="auth-box">

        <h1>🎓 Student AI</h1>

        <h2>Login</h2>

        <form
            action="/login"
            method="POST"
        >

            <!-- EMAIL -->

            <input
                type="email"
                name="email"
                placeholder="Enter Email"
                required
            >

            <!-- PASSWORD -->

            <input
                type="password"
                name="password"
                placeholder="Enter Password"
                required
            >

            <!-- BUTTON -->

            <button type="submit">
                Login
            </button>

        </form>

        <p>
            Don't have an account?

            <a href="/signup">
                Signup
            </a>
        </p>

    </div>

</div>

</body>
</html>
