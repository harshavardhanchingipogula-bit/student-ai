<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->

    <div class="sidebar">

        <div class="logo">🎓</div>

        <h2>Student AI</h2>

        <button class="new-chat">
            + New Chat
        </button>

        <div class="chat-history">

            <div class="chat-item">
                Chat 1
            </div>

        </div>

    </div>

    <!-- MAIN -->

    <div class="main">

        <!-- TOP -->

        <div class="topbar">

            <h1>AI Student Chatbot</h1>

            <p>Your Personal AI Study Assistant</p>

        </div>

        <!-- CHAT -->

        <div class="chat-area" id="chat-area">

            <div class="message bot">
                👋 Hello! How can I assist you today?
            </div>

        </div>

        <!-- INPUT -->

        <div class="input-area">

            <div class="input-box">

                <input
                    type="text"
                    id="user-input"
                    placeholder="Ask anything..."
                >

                <button
                    class="send-btn"
                    onclick="sendMessage()"
                >
                    ➤
                </button>

            </div>

        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
