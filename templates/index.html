<!DOCTYPE html>
<html>

<head>

    <title>Student AI</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css', v='1') }}"
    >

</head>

<body>

<div class="sidebar">

    <h2>🎓 Student AI</h2>

</div>

<div class="main">

    <div class="top">

        <h1>AI Student Chatbot</h1>

        <p>Your Personal AI Study Assistant</p>

    </div>

    <div
        class="chat-area"
        id="chat-area"
    >

        <div class="bot message">
            👋 Hello! How can I help you?
        </div>

    </div>

    <div class="input-area">

        <input
            type="text"
            id="user-input"
            placeholder="Ask anything..."
        >

        <button onclick="sendMessage()">
            ➤
        </button>

    </div>

</div>

<script
src="{{ url_for('static', filename='script.js', v='1') }}"
></script>

</body>
</html>
